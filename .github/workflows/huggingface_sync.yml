name: Sync to Hugging Face space
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://executor1389:$HF_TOKEN@huggingface.co/spaces/executor1389/modern-search-engine main
